<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Reminder App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Birthday Reminder App</h1>
        </header>

        <main>
            <section class="add-birthday">
                <h2>Add Birthday</h2>
                <form id="birthdayForm">
                    <input type="text" id="name" placeholder="Name" required>
                    <input type="date" id="date" required>
                    <button type="submit">Add Birthday</button>
                </form>
            </section>

            <section class="birthday-list">
                <h2>Birthday List</h2>
                <ul id="birthdayList">
                    <!-- Birthday items will appear here -->
                </ul>
            </section>
        </main>
   </div>
  <script>
        
        const birthdayList = document.getElementById('birthdayList');
        const addBirthdayForm = document.getElementById('birthdayForm');

  // Load birthdays from localStorage
  let birthdays = JSON.parse(localStorage.getItem('birthdays')) || [];

  // Helper function to calculate countdown
  function calculateCountdown(date) {
    const today = new Date();
    const nextBirthday = new Date(today.getFullYear(), date.getMonth(), date.getDate());

    if (nextBirthday < today) {
        nextBirthday.setFullYear(today.getFullYear() + 1);
      }

      const diff = nextBirthday - today;
      return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    // Render birthdays
    function renderBirthdays() {
      birthdayList.innerHTML = '';

      // Sort birthdays by date
      birthdays.sort((a, b) => new Date(a.date) - new Date(b.date));

      birthdays.forEach((birthday, index) => {
        const birthdayDate = new Date(birthday.date);
        const countdown = calculateCountdown(birthdayDate);
        const isUpcoming = countdown <= 7;

        const listItem = document.createElement('li');
        listItem.className = `list-group-item d-flex justify-content-between align-items-center ${isUpcoming ? 'upcoming' : ''}`;

        listItem.innerHTML = `
          <div>
            <strong>${birthday.name}</strong> <br>
            <span class="countdown">${countdown} day(s) remaining</span>
          </div>
          <div>
            <button class="btn btn-sm btn-warning me-2" onclick="editBirthday(${index})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteBirthday(${index})">Delete</button>
          </div>
        `;

        birthdayList.appendChild(listItem);
    });

localStorage.setItem('birthdays', JSON.stringify(birthdays));
}

// Add Birthday
addBirthdayForm.addEventListener('submit', (e) => {
e.preventDefault();

const name = document.getElementById('name').value;
const date = document.getElementById('date').value;

birthdays.push({ name, date });
addBirthdayForm.reset();
renderBirthdays();
});

// Edit Birthday
function editBirthday(index) {
const birthday = birthdays[index];

document.getElementById('name').value = birthday.name;
document.getElementById('date').value = birthday.date;

deleteBirthday(index);
}

// Delete Birthday
function deleteBirthday(index) {
birthdays.splice(index, 1);
renderBirthdays();
}
  // Initial render
  renderBirthdays();

    
    
   </script>

</body>
</html>
